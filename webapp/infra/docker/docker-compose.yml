# webapp/infra/docker/docker-compose.yml
services:
  webui:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.webui
    ports:
      - "3000:80"
    environment:
      - VITE_APP_ENV=local
    depends_on:
      api:
        condition: service_started
    networks:
      - gofannon-net

  api:
    build:
      context: ../../packages/api/user-service
      dockerfile: ../../../infra/docker/Dockerfile.api
    volumes:
      - ../../packages/api/user-service:/app
      # Auth config. .dev-auth.yaml is committed at the repo root
      # with three dev_stub users (alice/bob/site_admin_1) for local
      # testing. Production deployments override AUTH_CONFIG_PATH to
      # point at a real auth.yaml mounted from secrets — never use
      # the committed dev-auth.yaml in prod.
      - ../../../.dev-auth.yaml:/auth-config/auth.yaml:ro
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - STORAGE_PROVIDER=s3
      - S3_ENDPOINT_URL=http://seaweedfs:8333
      # S3_* rather than AWS_*: the standard AWS names are read by boto3 for
      # every AWS call, so setting them here makes any other AWS integration
      # in this process authenticate as the object store. config/__init__.py
      # reads the S3_ names, so the old ones left the credentials unset.
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-gofannon}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-gofannonsecret}
      - AWS_DEFAULT_REGION=us-east-1
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-couchdb}
      - COUCHDB_URL=${COUCHDB_URL:-http://couchdb:5984/}
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-password}
      - AUTH_CONFIG_PATH=/auth-config/auth.yaml
    env_file:
      - ./.env
    depends_on:
      couchdb:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - gofannon-net

  # SeaweedFS replaces MinIO: Community Edition was archived 2026-04-24 and
  # its images were deleted from Docker Hub 2026-09-11, with Quay closed to
  # anonymous pulls, so minio/minio can no longer be fetched at all.
  # `weed mini` runs master, volume, filer and the S3 gateway in one process
  # and creates S3_BUCKET on start -- which nothing did previously.
  #
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are how SeaweedFS takes its own
  # root credentials. This is the storage server, not an AWS client, so there
  # is nothing here to shadow -- do not rename these to S3_*.
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d  # 4.48, 2026-09-28
    ports:
      - "8333:8333"
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-gofannon}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-gofannonsecret}
      - S3_BUCKET=${S3_BUCKET_NAME:-local-bucket}
    volumes:
      - seaweed-data:/data
    networks:
      - gofannon-net
    command: mini -dir=/data

  couchdb:
    image: couchdb:3.4
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-password}
    volumes:
      - couchdb-data:/opt/couchdb/data
    networks:
      - gofannon-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5984/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  gofannon-net:
    driver: bridge

volumes:
  seaweed-data:
  couchdb-data:
