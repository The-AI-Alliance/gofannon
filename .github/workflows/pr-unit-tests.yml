name: PR Unit Tests

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'webapp/**'
      - '.github/workflows/pr-unit-tests.yml'

permissions:
  contents: read

jobs:
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # corepack ships with Node, so pnpm needs no third-party action.
      # setup-node has to run first for corepack to exist, which is why
      # its built-in `cache: pnpm` is replaced by the explicit cache step
      # below -- that option resolves the pnpm store path at the time
      # setup-node runs, when pnpm is not yet on PATH.
      #
      # The version is NOT named here. corepack reads it from the
      # packageManager field in webapp/package.json, hash included, so there
      # is one place to update when pnpm moves and the download is integrity
      # checked. That field is why every pnpm step runs inside ./webapp:
      # there is no package.json at the repo root for corepack to resolve.
      - name: Activate pnpm
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        working-directory: ./webapp
        run: |
          pnpm --version
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('webapp/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install Node.js dependencies
        working-directory: ./webapp
        run: pnpm install

      - name: Run frontend unit tests with coverage
        working-directory: ./webapp/packages/webui
        run: pnpm test:coverage

      # - name: Upload frontend coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./webapp/packages/webui/coverage/lcov.info
      #     flags: frontend
      #     name: frontend-coverage
      #     fail_ci_if_error: true

      - name: Check frontend coverage threshold
        working-directory: ./webapp/packages/webui
        run: |
          # Vitest will fail if coverage is below 95% threshold set in vitest.config.ts
          echo "Coverage threshold check passed"

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'webapp/packages/api/user-service/requirements.txt'

      - name: Install Python dependencies
        working-directory: ./webapp/packages/api/user-service
        run: pip install -r requirements.txt

      - name: Run backend unit tests with coverage
        working-directory: ./webapp/packages/api/user-service
        run: python -m pytest tests/unit -v --cov=. --cov-report=xml --cov-report=term-missing

      # - name: Upload backend coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./webapp/packages/api/user-service/coverage.xml
      #     flags: backend
      #     name: backend-coverage
      #     fail_ci_if_error: true

      - name: Check backend coverage threshold
        working-directory: ./webapp/packages/api/user-service
        run: |
          echo "Coverage threshold check passed (95% minimum enforced by pytest.ini)"

  lint-checks:
    name: Lint and Format Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # corepack ships with Node, so pnpm needs no third-party action.
      # setup-node has to run first for corepack to exist, which is why
      # its built-in `cache: pnpm` is replaced by the explicit cache step
      # below -- that option resolves the pnpm store path at the time
      # setup-node runs, when pnpm is not yet on PATH.
      #
      # The version is NOT named here. corepack reads it from the
      # packageManager field in webapp/package.json, hash included, so there
      # is one place to update when pnpm moves and the download is integrity
      # checked. That field is why every pnpm step runs inside ./webapp:
      # there is no package.json at the repo root for corepack to resolve.
      - name: Activate pnpm
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        working-directory: ./webapp
        run: |
          pnpm --version
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('webapp/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install Node.js dependencies
        working-directory: ./webapp
        run: pnpm install

      - name: Run frontend lint
        working-directory: ./webapp/packages/webui
        run: pnpm lint
