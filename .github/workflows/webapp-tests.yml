name: Run Integration and E2E Tests in Webapp

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # corepack ships with Node, so pnpm needs no third-party action.
      # setup-node has to run first for corepack to exist, which is why
      # its built-in `cache: pnpm` is replaced by the explicit cache step
      # below -- that option resolves the pnpm store path at the time
      # setup-node runs, when pnpm is not yet on PATH.
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('webapp/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Node.js dependencies
        working-directory: ./webapp
        run: pnpm install

      - name: Install Python dependencies
        working-directory: ./webapp/packages/api/user-service
        run: pip install -r requirements.txt
          
      - name: Install Playwright Browsers
        working-directory: ./webapp
        run: pnpm exec playwright install --with-deps chromium

      - name: Create .env file for Docker Compose
        working-directory: ./webapp/infra/docker
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Start services with Docker Compose
        working-directory: ./webapp/infra/docker
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for API server to be ready..."
          timeout 60s bash -c 'until curl -s http://localhost:8000/health | grep -q "healthy"; do sleep 2; done'
          echo "API server is up."
          
          echo "Waiting for Web UI to be ready..."
          timeout 60s bash -c 'until curl -s -o /dev/null http://localhost:3000; do sleep 2; done'
          echo "Web UI is up."

      - name: Run Python API Integration Tests
        working-directory: ./webapp
        run: pnpm test:integration:backend
        
      - name: Run Playwright E2E Tests
        working-directory: ./webapp
        run: pnpm test:e2e
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webapp/playwright-report/
          retention-days: 30

      - name: Stop services
        if: always()
        working-directory: ./webapp/infra/docker
        run: docker compose down
